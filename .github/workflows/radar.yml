name: Atualizar Radar
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rodar o robô
        run: node radar/update.mjs
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Salvar o resultado
        run: |
          git config user.name "vydo-radar"
          git config user.email "radar@users.noreply.github.com"
          git add radar/radar.json
          git diff --cached --quiet || (git commit -m "Atualiza o Radar" && git push)
